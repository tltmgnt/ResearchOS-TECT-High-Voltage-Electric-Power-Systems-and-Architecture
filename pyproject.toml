[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos-tect-power"
version = "0.1.0"
description = "Evidence-linked educational DC architecture and power-flow research"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
researchos-power = "researchos_power.cli:main"

[tool.setuptools.packages.find]
include = ["researchos_power*"]
